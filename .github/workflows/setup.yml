name: Setup

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-setup:
    name: The setup check passes on a fresh clone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true

      - name: Install
        run: make install

      - name: Setup check passes
        run: make verify
