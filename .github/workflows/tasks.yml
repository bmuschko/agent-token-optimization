name: Tasks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-starting-line:
    name: Every task is red and the regression suite is green
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true

      - name: Install
        run: make install

      - name: Regression suite stays green
        run: make test

      - name: Define the expected-outcome check for the steps below
        run: |
          cat > "$RUNNER_TEMP/expect_outcome.sh" <<'EOF'
          expect_outcome() {
            local want="$1" log="$RUNNER_TEMP/make.log" summary
            shift
            make "$@" 2>&1 | tee "$log" || true
            summary="$(grep -E '^=+ .*(passed|failed).* =+$' "$log" | tail -1)"
            if ! grep -q "$want" <<<"$summary"; then
              echo "::error::expected '$want' from 'make $*', got '${summary:-no pytest summary}'"
              return 1
            fi
            echo "make $* ended as expected: $want"
          }
          EOF
          echo "BASH_ENV=$RUNNER_TEMP/expect_outcome.sh" >> "$GITHUB_ENV"

      - name: Task T1 is expected to fail
        if: ${{ !cancelled() }}
        run: expect_outcome "3 failed, 1 passed" task T=t1

      - name: Task T2 is expected to fail
        if: ${{ !cancelled() }}
        run: expect_outcome "2 failed, 1 passed" task T=t2

      - name: Task T3 is expected to fail
        if: ${{ !cancelled() }}
        run: expect_outcome "2 failed, 1 passed" task T=t3

      - name: Task T4 is expected to fail
        if: ${{ !cancelled() }}
        run: expect_outcome "3 failed, 2 passed" task T=t4

      - name: Task T6 is expected to fail
        if: ${{ !cancelled() }}
        run: expect_outcome "2 failed, 1 passed" task T=t6

      - name: Task T8 is expected to fail
        if: ${{ !cancelled() }}
        run: expect_outcome "failed" task T=t8

      - name: Coverage of currency.py stops at 52 percent
        if: ${{ !cancelled() }}
        run: |
          if make coverage > coverage.log 2>&1; then
            echo "::error::'make coverage' passed, but T7 should start red"
            cat coverage.log
            exit 1
          fi
          grep -q "Total coverage: 52" coverage.log || {
            echo "::error::coverage is no longer 52 percent"
            cat coverage.log
            exit 1
          }

      - name: Running the targets leaves the tree unchanged
        if: ${{ !cancelled() }}
        run: |
          make clean
          rm -f coverage.log
          git status --porcelain
          test -z "$(git status --porcelain)"
