name: Tasks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-starting-line:
    name: Every task is red and the regression suite is green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: make install

      - name: Regression suite stays green
        run: make test

      - name: T1 fails 3 of 4
        if: ${{ !cancelled() }}
        run: scripts/expect_outcome.sh "3 failed, 1 passed" task T=t1

      - name: T2 fails 2 of 3
        if: ${{ !cancelled() }}
        run: scripts/expect_outcome.sh "2 failed, 1 passed" task T=t2

      - name: T3 fails 2 of 3
        if: ${{ !cancelled() }}
        run: scripts/expect_outcome.sh "2 failed, 1 passed" task T=t3

      - name: T4 fails 3 of 5
        if: ${{ !cancelled() }}
        run: scripts/expect_outcome.sh "3 failed, 2 passed" task T=t4

      - name: T6 fails 2 of 3
        if: ${{ !cancelled() }}
        run: scripts/expect_outcome.sh "2 failed, 1 passed" task T=t6

      - name: T8 fails
        if: ${{ !cancelled() }}
        run: scripts/expect_outcome.sh "failed" task T=t8

      - name: Coverage of currency.py stops at 52 percent
        if: ${{ !cancelled() }}
        run: |
          if make coverage > coverage.log 2>&1; then
            echo "::error::'make coverage' passed, but T7 should start red"
            cat coverage.log
            exit 1
          fi
          grep -q "Total coverage: 52" coverage.log || {
            echo "::error::coverage is no longer 52 percent"
            cat coverage.log
            exit 1
          }

      - name: Running the targets leaves the tree unchanged
        if: ${{ !cancelled() }}
        run: |
          make clean
          rm -f coverage.log
          git status --porcelain
          test -z "$(git status --porcelain)"
