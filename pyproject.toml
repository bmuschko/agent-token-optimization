[project]
name = "orderly"
version = "0.1.0"
description = "Orderly, the sample order service worked in the agent token optimization course."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/tasks", "exercises"]
pythonpath = ["src"]
addopts = "-q"
